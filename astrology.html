<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7f3"><title>Astrology — Siddha Astro</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="/logo.png"><style>
.astrology-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:16px;box-shadow:0 8px 24px var(--shadow)}
.astrology-tab{border:0;border-radius:11px;background:transparent;color:var(--text);padding:11px 7px;font-weight:800;font-size:.78rem;min-height:48px}
.astrology-tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-dark);box-shadow:inset 0 -3px 0 var(--gold)}

const frame=document.getElementById("astrologyContent"),tabs=[...document.querySelectorAll(".astrology-tab")];
function selectTab(tab){tabs.forEach(t=>t.setAttribute("aria-selected",String(t===tab)));frame.src=tab.dataset.page}
tabs.forEach(t=>t.addEventListener("click",()=>selectTab(t)));
frame.addEventListener("load",()=>{try{const d=frame.contentDocument;if(!d)return;const st=d.createElement("style");st.textContent=".header,.controls,.nav,.footer,.hero{display:none!important}.app{padding-bottom:0!important;min-height:0!important}.main{padding:8px 0 20px!important;max-width:none!important}.card{margin-bottom:12px!important}body{background:transparent!important}";d.head.appendChild(st);d.querySelectorAll("a[href='index.html']").forEach(a=>{if(a.closest(".brand"))a.href="index.html"});}catch(e){}});
