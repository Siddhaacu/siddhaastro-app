<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kundali — Siddha Astro</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header class="header"><div class="header-inner"><a class="brand" href="index.html"><img src="logo.png" alt="Siddha Astro"><span><span class="brand-name">Siddha Astro</span><span class="brand-tag">Vedic wisdom, simply presented</span></span></a><div class="page-title"><strong>Kundali</strong><span>Birth chart</span></div></div></header><div class="controls"><button class="lang-btn" data-lang aria-label="Language">తెలుగు</button><button class="icon-btn" data-theme>◐</button><button class="font-btn" data-font="down">−</button><span class="font-size" data-font-size>100%</span><button class="font-btn" data-font="up">+</button></div><main class="main"><section class="hero"><div class="eyebrow">Birth chart</div><h1>Kundali</h1><p>Enter your birth details for a chart overview.</p></section><section class="card"><div class="form-grid"><div class="field"><label>Birth date</label><input id="birthDate" type="date"></div><div class="field"><label>Birth time</label><input id="birthTime" type="time" value="12:00"></div><div class="field"><label>Birth city</label><input id="birthCity" value="Hyderabad"></div></div><div class="actions" style="margin-top:14px"><button class="btn btn-primary" id="calculateBtn">Generate Kundali</button></div></section><section class="card" id="resultsContainer"><div class="empty">Enter your details and generate your Kundali.</div></section></main><nav class="nav"><a href="index.html" class="">⌂<span>Home</span></a><a href="panchangam.html" class="">◫<span>Panchangam</span></a><a href="horoscope.html" class="">✦<span>Horoscope</span></a><a href="kundali.html" class="active">◈<span>Kundali</span></a><a href="more.html" class="">•••<span>More</span></a></nav></div><script src="app.js"></script><script src="kundali.js"></script><script>document.addEventListener("DOMContentLoaded",()=>calculateBtn.onclick=()=>{if(!birthDate.value||!birthTime.value){resultsContainer.innerHTML='<div class="message error">Please enter birth date and time.</div>';return}const k=SiddhaKundali.calculateKundali(birthDate.value,birthTime.value,birthCity.value||"Hyderabad");resultsContainer.innerHTML='<h2>Chart overview</h2><div class="result-grid"><div class="tile"><div class="tile-label">Lagna</div><div class="tile-value">'+k.lagna+'</div></div><div class="tile"><div class="tile-label">Moon Rashi</div><div class="tile-value">'+k.moon+'</div></div><div class="tile"><div class="tile-label">Nakshatra</div><div class="tile-value">'+k.moonNakshatra+'</div></div></div><h3>Planets</h3><div class="planet-grid">'+Object.entries(k.planets).map(([n,p])=>'<div class="tile"><div class="tile-label">'+n+'</div><div class="tile-value">'+p.rashi+'</div></div>').join("")+'</div><h3>Insights</h3><ul class="result-list">'+k.insights.map(x=>'<li>'+x+'</li>').join("")+'</ul>'})</script></body></html>
