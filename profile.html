<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>My Profile — Siddha Astro</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="/logo.png"><style>
body{background:#fff}.profile-app{min-height:100vh;padding-bottom:25px;background:#fff;color:#111820}.profile-header{height:76px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 18px;border-bottom:1px solid #eef0f2}.profile-header a{color:#111820;text-decoration:none;font-size:2rem;line-height:1}.profile-header h1{text-align:center;font-size:1.25rem;margin:0;font-weight:700}.profile-header button{border:0;background:none;font-size:1.8rem;color:#111820}.profile-main{max-width:520px;margin:0 auto;padding:24px 24px 40px}.profile-menu-wrap{position:relative;display:flex;justify-content:flex-end;height:0}.profile-menu{position:absolute;z-index:5;top:-30px;right:-10px;background:white;border:1px solid #eee;border-radius:7px;box-shadow:0 6px 18px #0002;padding:15px 20px;min-width:210px;display:none}.profile-menu.open{display:block}.profile-menu button{border:0;background:none;font-weight:700;color:#151b21;width:100%;text-align:left;padding:8px}.avatar{width:118px;height:118px;border:6px solid #111820;border-radius:50%;margin:44px auto 34px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#111820;position:relative}.avatar svg{width:55px;height:55px;fill:#111820}.avatar .edit{position:absolute;bottom:0;width:100%;background:#7f8589;color:#fff;text-align:center;font-weight:800;line-height:1.4}.greeting{font-size:clamp(1.55rem,5vw,2rem);line-height:1.35;margin:0 0 48px;font-weight:750;overflow-wrap:anywhere}.profile-field{margin:0 0 24px;position:relative}.profile-field label{position:absolute;left:18px;top:-15px;padding:0 5px;background:white;color:#e85a10;font-size:1rem;font-weight:700}.profile-field input{height:72px;border:1.5px solid #aaa;border-radius:25px;padding:20px 18px 12px;font-size:1.2rem;font-weight:650;color:#111820;background:white}.profile-field input:disabled{color:#999;background:white;opacity:1}.verify-note{display:flex;gap:12px;align-items:flex-start;margin:-10px 0 46px;font-size:.95rem;line-height:1.4;font-weight:650}.verify-note span{color:#e85a10;font-size:1.3rem}.profile-primary{width:100%;height:62px;border:0;border-radius:26px;background:#ed5a0b;color:white;font-size:1.35rem;font-weight:800}.profile-secondary{display:block;margin:24px auto 0;border:0;background:none;color:#e85a10;font-size:1.35rem;font-weight:750;padding:4px 12px}.google-btn{width:100%;margin:0 0 18px;border:1px solid #dadce0;border-radius:14px;background:#fff;color:#222;padding:14px 12px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:12px}.google-mark{font-size:1.3rem;font-weight:900;color:#4285f4}.consent{font-size:.78rem;color:#5d6670;display:flex;gap:9px;align-items:flex-start;margin:0 0 20px;line-height:1.4}.consent input{width:18px;min-width:18px;margin:2px 0 0;accent-color:#ed5a0b}.profile-status{font-size:.82rem;margin:14px 0;color:#475569;line-height:1.5}.hidden{display:none!important}@media(max-width:420px){.profile-main{padding:20px 24px}.greeting{margin-bottom:42px}.profile-field input{font-size:1.08rem}}
</style></head><body><div class="profile-app"><header class="profile-header"><a href="index.html" aria-label="Back to home">‹</a><h1>My Profile</h1><button id="menuToggle" aria-label="Profile menu">⋮</button></header><main class="profile-main"><div class="profile-menu-wrap"><div id="profileMenu" class="profile-menu"><button id="deleteAccount" style="color:#b42318">♜ &nbsp; Delete Account</button></div></div><section id="signedOut"><div class="avatar" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="19" r="12"/><path d="M9 58c0-15 8-23 23-23s23 8 23 23z"/></svg></div><h2 class="greeting">Sign in to Siddha Astro</h2><label class="consent"><input id="reportConsent" type="checkbox"><span>I agree that my email address and account creation date may be included in a weekly administrator report for service management.</span></label><button class="google-btn" id="googleSignIn"><span class="google-mark">G</span> Continue with Google</button><p class="profile-status" id="authStatus" role="status">Sign in securely with your Google account.</p></section><section id="signedIn" class="hidden"><div class="avatar" id="avatar"><svg viewBox="0 0 64 64"><circle cx="32" cy="19" r="12"/><path d="M9 58c0-15 8-23 23-23s23 8 23 23z"/></svg><div class="edit">EDIT</div></div><h2 class="greeting" id="greeting">Hi there!</h2><form id="profileForm"><div class="profile-field"><label for="displayName">First Name</label><input id="displayName" autocomplete="name" required maxlength="100"></div><div class="profile-field"><label for="email">Account email</label><input id="email" type="email" disabled readonly></div><p class="verify-note"><span>✿</span><span>Your Google account verifies this email address.</span></p><button class="profile-primary" type="submit">Save</button><button class="profile-secondary" type="button" id="signOut">Sign Out</button></form></section><p class="profile-status" id="profileStatus" role="status"></p></main></div><script type="module" src="auth.js"></script></body></html>
