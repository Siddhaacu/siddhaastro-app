<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kundali - Siddha Astro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 {
            text-align: center;
            color: #ffc107;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .form-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ffc107;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            color: #ffc107;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.95em;
        }
        input[type="date"],
        input[type="time"],
        input[type="text"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ffc107;
            border-radius: 8px;
            background: rgba(255, 193, 7, 0.1);
            color: #ffc107;
            font-size: 1em;
        }
        input::placeholder {
            color: rgba(255, 193, 7, 0.5);
        }
        input:focus,
        select:focus {
            outline: none;
            box-shadow: 0 0 10px #ffc107;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #ffc107 0%, #ffb300 100%);
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 193, 7, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        .kundali-results {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ffc107;
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            margin-top: 20px;
        }
        .result-header {
            border-bottom: 2px solid #ffc107;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .result-header h2 {
            color: #ffc107;
            font-size: 1.8em;
        }
        .basic-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .info-box {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
        }
        .info-label {
            color: #ffc107;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .info-value {
            color: #fff;
            font-weight: bold;
            font-size: 1.2em;
        }
        .section {
            margin-bottom: 25px;
        }
        .section-title {
            color: #ffc107;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(255, 193, 7, 0.3);
            padding-bottom: 10px;
        }
        .planet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .planet-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 193, 7, 0.3);
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #ffc107;
        }
        .planet-name {
            color: #ffc107;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .planet-detail {
            font-size: 0.9em;
            color: #ddd;
            margin: 3px 0;
        }
        .planet-status {
            display: inline-block;
            margin-top: 5px;
            padding: 3px 8px;
            background: rgba(255, 193, 7, 0.2);
            border-radius: 4px;
            font-size: 0.8em;
            color: #ffeb3b;
        }
        .insights-list {
            list-style: none;
        }
        .insights-list li {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 15px;
            margin-bottom: 10px;
            border-left: 4px solid #ffc107;
            border-radius: 8px;
            line-height: 1.5;
        }
        .remedy-box {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .remedy-planet {
            color: #ffc107;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .remedy-text {
            color: #ddd;
            margin-bottom: 8px;
            line-height: 1.5;
        }
        .remedy-mantra {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-left: 3px solid #ffc107;
            font-style: italic;
            color: #ffeb3b;
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: #ffc107;
        }
        .error {
            background: rgba(244, 67, 54, 0.1);
            border: 2px solid #f44336;
            color: #ff9999;
            padding: 15px;
            border-radius: 8px;
        }
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 10px 20px;
            background: rgba(255, 193, 7, 0.2);
            border: 2px solid #ffc107;
            color: #ffc107;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .nav-btn:hover {
            background: #ffc107;
            color: #1a1a2e;
        }
        .api-info {
            background: rgba(100, 200, 255, 0.1);
            border: 1px solid #64c8ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #b3e5fc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Birth Chart (Kundali)</h1>

        <div class="api-info">
            ✓ Using <strong>Free Birth Chart Calculator</strong> - No API Key Required | Completely Free
        </div>

        <div class="form-card">
            <h2 style="color: #ffc107; margin-bottom: 20px;">📝 Enter Your Birth Details</h2>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="birthDate">Birth Date</label>
                    <input type="date" id="birthDate" />
                </div>
                <div class="form-group">
                    <label for="birthTime">Birth Time</label>
                    <input type="time" id="birthTime" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="birthCity">Birth City</label>
                    <select id="birthCity">
                        <option value="Hyderabad">Hyderabad</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Bangalore">Bangalore</option>
                        <option value="Chennai">Chennai</option>
                        <option value="Kolkata">Kolkata</option>
                        <option value="Pune">Pune</option>
                        <option value="Ahmedabad">Ahmedabad</option>
                    </select>
                </div>
            </div>

            <button onclick="calculateKundali()">🔮 Calculate Kundali</button>
            <button onclick="resetForm()" style="background: rgba(255, 193, 7, 0.2); color: #ffc107; margin-top: 10px;">↻ Reset</button>
        </div>

        <div id="resultsContainer"></div>

        <div class="nav-bar">
            <a href="index-updated.html" class="nav-btn">⌂ Home</a>
            <a href="panchangam-updated.html" class="nav-btn">📅 Panchangam</a>
            <a href="horoscope-updated.html" class="nav-btn">☀ Horoscope</a>
            <a href="tarabalam-updated.html" class="nav-btn">⭐ Nakshatras</a>
            <a href="chandrabalam-updated.html" class="nav-btn">🌙 Moon Phase</a>
        </div>
    </div>

    <script src="kundali-free-api.js"></script>
    <script>
        function calculateKundali() {
            const birthDate = document.getElementById('birthDate').value;
            const birthTime = document.getElementById('birthTime').value;
            const birthCity = document.getElementById('birthCity').value;

            if (!birthDate || !birthTime) {
                alert('Please fill in all fields');
                return;
            }

            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = '<div class="loading"><p>🔮 Calculating your birth chart...</p></div>';

            try {
                const kundali = window.SiddhaKundali.calculateKundali(birthDate, birthTime, birthCity);

                if (kundali) {
                    displayKundali(kundali, resultsContainer);
                } else {
                    resultsContainer.innerHTML = '<div class="error">Failed to calculate Kundali. Please check your details.</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                resultsContainer.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        function displayKundali(kundali, container) {
            let html = `
                <div class="kundali-results">
                    <div class="result-header">
                        <h2>🌟 Your Birth Chart Analysis</h2>
                    </div>

                    <div class="basic-info">
                        <div class="info-box">
                            <div class="info-label">Birth Date</div>
                            <div class="info-value">${kundali.birthDate}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Birth Time</div>
                            <div class="info-value">${kundali.birthTime}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Birth City</div>
                            <div class="info-value">${kundali.birthCity}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Lagna (Ascendant)</div>
                            <div class="info-value">${kundali.lagna}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Moon Sign</div>
                            <div class="info-value">${kundali.moon}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Birth Nakshatra</div>
                            <div class="info-value">${kundali.moonNakshatra}</div>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">🪐 Planetary Positions</div>
                        <div class="planet-grid">
            `;

            for (const [planet, data] of Object.entries(kundali.planets)) {
                html += `
                    <div class="planet-card">
                        <div class="planet-name">${planet}</div>
                        <div class="planet-detail"><strong>${data.rashi}</strong></div>
                        <div class="planet-detail">°${data.degreeInRashi}</div>
                        <div class="planet-status">${data.status}</div>
                    </div>
                `;
            }

            html += `
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">🏠 Important Houses</div>
                        <div class="planet-grid">
            `;

            for (const [house, rashi] of Object.entries(kundali.houses)) {
                html += `
                    <div class="planet-card">
                        <div class="planet-name">${house}</div>
                        <div class="planet-detail"><strong>${rashi}</strong></div>
                    </div>
                `;
            }

            html += `
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">⏳ Current Dasha Period</div>
                        <div style="background: rgba(255, 255, 255, 0.05); border: 1px solid #ffc107; padding: 15px; border-radius: 8px;">
                            <div style="margin-bottom: 10px;"><strong>Current:</strong> ${kundali.dasha.current}</div>
                            <div style="margin-bottom: 10px;"><strong>Next:</strong> ${kundali.dasha.next}</div>
                            <div style="color: #ffeb3b; font-style: italic;">${kundali.dasha.message}</div>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">💡 Key Insights</div>
                        <ul class="insights-list">
            `;

            kundali.insights.forEach(insight => {
                html += `<li>${insight}</li>`;
            });

            html += `
                        </ul>
                    </div>

                    <div class="section">
                        <div class="section-title">🕉️ Recommended Remedies</div>
            `;

            kundali.remedies.forEach(remedy => {
                html += `
                    <div class="remedy-box">
                        <div class="remedy-planet">${remedy.planet}</div>
                        <div class="remedy-text">${remedy.remedy}</div>
                        <div class="remedy-mantra">Mantra: ${remedy.mantra}</div>
                    </div>
                `;
            });

            html += `
                    </div>

                    <div class="section">
                        <div class="section-title">📊 Chart Summary</div>
                        <div class="basic-info">
                            <div class="info-box">
                                <div class="info-label">Overall Strength</div>
                                <div class="info-value">${kundali.kundaliSummary.overallStrength}</div>
                            </div>
                            <div class="info-box">
                                <div class="info-label">Strong Planets</div>
                                <div class="info-value" style="font-size: 0.9em;">${kundali.kundaliSummary.strongPlanets.join(', ')}</div>
                            </div>
                            <div class="info-box">
                                <div class="info-label">Planets Needing Care</div>
                                <div class="info-value" style="font-size: 0.9em;">${kundali.kundaliSummary.weakPlanets.join(', ')}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function resetForm() {
            document.getElementById('birthDate').value = '';
            document.getElementById('birthTime').value = '';
            document.getElementById('birthCity').value = 'Hyderabad';
            document.getElementById('resultsContainer').innerHTML = '';
        }

        window.addEventListener('load', () => {
            const today = new Date();
            document.getElementById('birthDate').value = today.toISOString().split('T')[0];
        });
    </script>
</body>
</html>
