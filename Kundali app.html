<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kundali - Siddha Astro</title>
    <link rel="stylesheet" href="app-theme.css">
    <style>
        .form-group {
            margin-bottom: var(--spacing-lg);
        }

        .form-label {
            display: block;
            margin-bottom: var(--spacing-sm);
            color: var(--accent);
            font-weight: 600;
            font-size: calc(0.95em * var(--scale));
        }

        .form-input {
            width: 100%;
            padding: var(--spacing-md);
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: calc(1em * var(--scale));
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-md);
        }

        .planet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
        }

        .planet-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: var(--spacing-md);
            text-align: center;
            transition: all 0.3s ease;
        }

        .planet-card:hover {
            box-shadow: 0 4px 12px var(--shadow);
            border-color: var(--accent);
        }

        .planet-icon {
            font-size: calc(2em * var(--scale));
            margin-bottom: var(--spacing-sm);
        }

        .planet-name {
            font-size: calc(0.95em * var(--scale));
            font-weight: 600;
            color: var(--accent);
            margin-bottom: var(--spacing-sm);
        }

        .planet-position {
            font-size: calc(0.85em * var(--scale));
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
        }

        .planet-strength {
            padding: var(--spacing-sm);
            border-radius: 4px;
            font-size: calc(0.8em * var(--scale));
            font-weight: 600;
            margin-top: var(--spacing-sm);
        }

        .strength-strong {
            background: rgba(76, 175, 80, 0.2);
            color: #81c784;
        }

        .strength-weak {
            background: rgba(244, 67, 54, 0.2);
            color: #ef9a9a;
        }

        .strength-exalted {
            background: rgba(212, 175, 55, 0.2);
            color: var(--accent);
        }

        .strength-debilitated {
            background: rgba(156, 39, 176, 0.2);
            color: #ba68c8;
        }

        .chart-display {
            background: var(--bg-secondary);
            border-left: 4px solid var(--spiritual-blue);
            border-radius: 12px;
            padding: var(--spacing-lg);
            margin-top: var(--spacing-lg);
        }

        .chart-title {
            font-size: calc(1.3em * var(--scale));
            color: var(--accent);
            margin-bottom: var(--spacing-lg);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .chart-icon {
            font-size: calc(1.8em * var(--scale));
        }

        .houses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .house-card {
            background: var(--bg-tertiary);
            padding: var(--spacing-md);
            border-radius: 8px;
            text-align: center;
            border-left: 3px solid var(--accent);
        }

        .house-label {
            font-size: calc(0.75em * var(--scale));
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: var(--spacing-xs);
        }

        .house-value {
            font-size: calc(1em * var(--scale));
            font-weight: 600;
            color: var(--accent);
        }

        .dasha-section {
            background: var(--bg-tertiary);
            padding: var(--spacing-lg);
            border-radius: 8px;
            margin-bottom: var(--spacing-lg);
            border-left: 3px solid var(--spiritual-saffron);
        }

        .dasha-title {
            font-size: calc(1.05em * var(--scale));
            font-weight: 600;
            color: var(--spiritual-saffron);
            margin-bottom: var(--spacing-md);
        }

        .dasha-info {
            display: grid;
            gap: var(--spacing-md);
        }

        .dasha-item {
            display: flex;
            justify-content: space-between;
            padding: var(--spacing-sm);
            background: var(--bg-secondary);
            border-radius: 4px;
            font-size: calc(0.9em * var(--scale));
        }

        .dasha-label {
            color: var(--text-secondary);
        }

        .dasha-value {
            color: var(--accent);
            font-weight: 600;
        }

        .insights-section {
            background: linear-gradient(135deg, var(--spiritual-purple) 0%, var(--spiritual-blue) 100%);
            color: white;
            padding: var(--spacing-lg);
            border-radius: 12px;
            margin-bottom: var(--spacing-lg);
        }

        .insights-title {
            font-size: calc(1.1em * var(--scale));
            font-weight: 600;
            margin-bottom: var(--spacing-md);
        }

        .insights-text {
            font-size: calc(0.95em * var(--scale));
            line-height: 1.8;
            margin-bottom: var(--spacing-md);
        }

        .remedies-section {
            background: var(--bg-tertiary);
            padding: var(--spacing-lg);
            border-radius: 8px;
            border-left: 3px solid var(--spiritual-saffron);
        }

        .remedies-title {
            font-size: calc(1.05em * var(--scale));
            font-weight: 600;
            color: var(--spiritual-saffron);
            margin-bottom: var(--spacing-md);
        }

        .remedy-item {
            background: var(--bg-secondary);
            padding: var(--spacing-md);
            border-radius: 6px;
            margin-bottom: var(--spacing-md);
        }

        .remedy-planet {
            font-size: calc(0.9em * var(--scale));
            color: var(--accent);
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
        }

        .remedy-text {
            font-size: calc(0.9em * var(--scale));
            color: var(--text-primary);
            line-height: 1.6;
        }

        .loading-state {
            text-align: center;
            padding: var(--spacing-xl);
            color: var(--text-secondary);
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="dark-mode">
    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <h1>📊 Kundali</h1>
            <p class="app-header-subtitle">Birth Chart Analysis</p>
        </div>

        <!-- Controls Bar -->
        <div class="app-content" style="padding-top: 0;">
            <div class="controls-bar">
                <div class="theme-toggle">
                    <span>Theme:</span>
                    <button class="theme-toggle-btn" id="theme-toggle-btn">☀️</button>
                </div>
                <div class="font-controls">
                    <button class="font-control-btn" id="font-decrease-btn">−</button>
                    <span class="font-size-display" id="font-size-display">100%</span>
                    <button class="font-control-btn" id="font-increase-btn">+</button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="app-content">
            <!-- Birth Details Form -->
            <div class="spiritual-card">
                <div class="spiritual-card-title">
                    <span class="spiritual-card-icon">📋</span>
                    Birth Details
                </div>

                <div class="form-group">
                    <label class="form-label">📅 Date of Birth</label>
                    <input type="date" id="birthDate" class="form-input" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">⏰ Time of Birth</label>
                        <input type="time" id="birthTime" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">📍 City of Birth</label>
                        <select id="birthCity" class="form-input" required>
                            <option value="">Select City</option>
                            <option value="Hyderabad">Hyderabad</option>
                            <option value="Mumbai">Mumbai</option>
                            <option value="Delhi">Delhi</option>
                            <option value="Bangalore">Bangalore</option>
                            <option value="Chennai">Chennai</option>
                            <option value="Kolkata">Kolkata</option>
                            <option value="Pune">Pune</option>
                            <option value="Ahmedabad">Ahmedabad</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; gap: var(--spacing-md);">
                    <button class="btn btn-primary" onclick="calculateKundali()" style="width: 100%;">
                        🔮 Calculate Kundali
                    </button>
                </div>
            </div>

            <!-- Results Container -->
            <div id="resultsContainer"></div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="index-app.html" class="nav-item">
            <div class="nav-icon">🏠</div>
            <div class="nav-label">Home</div>
        </a>
        <a href="panchangam-app.html" class="nav-item">
            <div class="nav-icon">📅</div>
            <div class="nav-label">Panchangam</div>
        </a>
        <a href="horoscope-app.html" class="nav-item">
            <div class="nav-icon">☀️</div>
            <div class="nav-label">Horoscope</div>
        </a>
        <a href="kundali-app.html" class="nav-item active">
            <div class="nav-icon">📊</div>
            <div class="nav-label">Kundali</div>
        </a>
        <a href="more-app.html" class="nav-item">
            <div class="nav-icon">⭐</div>
            <div class="nav-label">More</div>
        </a>
    </div>

    <script src="app-controls.js"></script>
    <script src="kundali-free-api.js"></script>
    <script>
        // Set default date to today
        window.addEventListener('load', () => {
            const today = new Date();
            document.getElementById('birthDate').value = today.toISOString().split('T')[0];
        });

        async function calculateKundali() {
            const date = document.getElementById('birthDate').value;
            const time = document.getElementById('birthTime').value;
            const city = document.getElementById('birthCity').value;
            const resultsDiv = document.getElementById('resultsContainer');

            if (!date || !time || !city) {
                resultsDiv.innerHTML = '<div style="color: var(--text-secondary); text-align: center; padding: var(--spacing-lg);">⚠️ Please fill all fields</div>';
                return;
            }

            resultsDiv.innerHTML = `
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: var(--spacing-md);">Calculating your birth chart...</p>
                </div>
            `;

            try {
                const [year, month, day] = date.split('-');
                const birthDate = new Date(year, parseInt(month) - 1, day);
                const [hours, minutes] = time.split(':');

                const kundali = await window.SiddhaKundali.calculateKundali(birthDate, `${hours}:${minutes}`, city);
                displayKundali(kundali);
            } catch (error) {
                console.error('Error:', error);
                resultsDiv.innerHTML = `<div style="color: var(--text-secondary); text-align: center; padding: var(--spacing-lg);">❌ Error calculating Kundali: ${error.message}</div>`;
            }
        }

        function displayKundali(kundali) {
            let html = '';

            // Planets Section
            if (kundali.planets && kundali.planets.length > 0) {
                html += `
                    <div class="chart-display">
                        <div class="chart-title">
                            <span class="chart-icon">🌍</span>
                            Planetary Positions
                        </div>
                        <div class="planet-grid">
                `;

                kundali.planets.forEach(planet => {
                    let strengthClass = 'strength-weak';
                    let strengthText = planet.strength || 'Normal';

                    if (strengthText.includes('Exalted')) strengthClass = 'strength-exalted';
                    else if (strengthText.includes('Strong')) strengthClass = 'strength-strong';
                    else if (strengthText.includes('Debilitated')) strengthClass = 'strength-debilitated';

                    html += `
                        <div class="planet-card">
                            <div class="planet-icon">${getPlanetIcon(planet.name)}</div>
                            <div class="planet-name">${planet.name}</div>
                            <div class="planet-position">${planet.rashi} ${planet.nakshatra}</div>
                            <div class="planet-strength ${strengthClass}">${strengthText}</div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            }

            // Houses Section
            if (kundali.houses && kundali.houses.length > 0) {
                html += `
                    <div class="chart-display">
                        <div class="chart-title">
                            <span class="chart-icon">🏠</span>
                            Bhava Houses
                        </div>
                        <div class="houses-grid">
                `;

                kundali.houses.forEach((house, index) => {
                    html += `
                        <div class="house-card">
                            <div class="house-label">House ${index + 1}</div>
                            <div class="house-value">${house}</div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            }

            // Dasha Section
            if (kundali.dasha) {
                html += `
                    <div class="dasha-section">
                        <div class="dasha-title">⏳ Maha Dasha (Major Period)</div>
                        <div class="dasha-info">
                            <div class="dasha-item">
                                <span class="dasha-label">Current Dasha</span>
                                <span class="dasha-value">${kundali.dasha.current || '—'}</span>
                            </div>
                            <div class="dasha-item">
                                <span class="dasha-label">Duration</span>
                                <span class="dasha-value">${kundali.dasha.duration || '—'}</span>
                            </div>
                            <div class="dasha-item">
                                <span class="dasha-label">Start Year</span>
                                <span class="dasha-value">${kundali.dasha.startYear || '—'}</span>
                            </div>
                            <div class="dasha-item">
                                <span class="dasha-label">End Year</span>
                                <span class="dasha-value">${kundali.dasha.endYear || '—'}</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Insights Section
            if (kundali.insights) {
                html += `
                    <div class="insights-section">
                        <div class="insights-title">✨ Insights</div>
                        <div class="insights-text">${kundali.insights}</div>
                    </div>
                `;
            }

            // Remedies Section
            if (kundali.remedies && kundali.remedies.length > 0) {
                html += `
                    <div class="remedies-section">
                        <div class="remedies-title">🙏 Personalized Remedies</div>
                        <div class="dasha-info">
                `;

                kundali.remedies.forEach(remedy => {
                    html += `
                        <div class="remedy-item">
                            <div class="remedy-planet">${remedy.planet}</div>
                            <div class="remedy-text">
                                📿 <strong>Mantra:</strong> ${remedy.mantra || 'Om Namah Shivaya'}<br>
                                💎 <strong>Remedy:</strong> ${remedy.remedy || 'Perform regular puja and meditation'}
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            }

            document.getElementById('resultsContainer').innerHTML = html;
        }

        function getPlanetIcon(planetName) {
            const icons = {
                'Sun': '☉',
                'Moon': '☽',
                'Mercury': '☿',
                'Venus': '♀',
                'Mars': '♂',
                'Jupiter': '♃',
                'Saturn': '♄',
                'Rahu': '⚪',
                'Ketu': '⚫'
            };
            return icons[planetName] || '•';
        }

        window.addEventListener('load', () => {
            console.log('📊 Kundali App loaded');
        });
    </script>
</body>
</html>
