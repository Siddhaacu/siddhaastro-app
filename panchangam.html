<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17102b"><link rel="icon" type="image/png" href="./logo.png"><link rel="apple-touch-icon" href="./logo.png"><title>Siddha Astro Panchangam</title>
<style>
:root{--bg:#0e0919;--panel:#17102b;--gold:#f4c65d;--gold2:#ffe8a4;--text:#fffaf0;--muted:#b9accb;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;background:#08050e;color:var(--text);font-family:Inter,system-ui,sans-serif;display:flex;justify-content:center}.app{width:100%;max-width:430px;min-height:100vh;background:radial-gradient(circle at 50% 0,#38205c,#17102b 34%,#0e0919 75%);padding-bottom:30px}.top{padding:18px;background:linear-gradient(180deg,#21133b,#17102b);border-bottom:1px solid var(--line)}.brandline{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:14px;border:2px solid var(--gold);object-fit:cover}.brand{font-size:20px;font-weight:800}.brand span{color:var(--gold)}.back{display:inline-block;color:var(--gold2);text-decoration:none;margin-bottom:16px}.content{padding:18px}.section{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.section h2{font-size:19px;margin:0}.section small{color:var(--muted)}.panel{border:1px solid #f4c65d55;border-radius:22px;padding:16px;background:linear-gradient(145deg,#382448,#211532);margin-bottom:18px}.controls{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}.btn,.date{border:1px solid #f4c65d55;background:#ffffff0d;color:var(--gold2);border-radius:12px;padding:10px;font-weight:700}.date{width:145px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fact{background:#ffffff09;border:1px solid var(--line);border-radius:14px;padding:12px}.fact span{display:block;color:var(--muted);font-size:11px}.fact b{display:block;margin-top:5px;font-size:14px;line-height:1.35}.status{color:var(--muted);font-size:12px;margin:0 0 12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;color:var(--gold);font-size:11px;font-weight:800;padding:6px 0}.day{min-height:42px;border:1px solid var(--line);border-radius:9px;background:#ffffff08;color:var(--text);font-weight:700}.day.empty{visibility:hidden}.day.selected{background:var(--gold);color:#251530;border-color:var(--gold)}.day.today{outline:1px solid var(--gold2)}.month-title{text-align:center;font-weight:800;color:var(--gold2)}
</style></head>
<body><div class="app"><header class="top"><a class="back" href="./index.html">← Back to Siddha Astro</a><div class="brandline"><img class="logo" src="./logo.png" alt="Siddha Astro logo"><div class="brand">Siddha <span>Astro</span> Panchangam</div></div></header><main class="content">
<div class="section"><h2>Full Panchangam Calendar</h2><small id="yearLabel"></small></div><section class="panel"><div class="controls"><button class="btn" id="prevMonth">‹</button><div class="month-title" id="monthTitle"></div><button class="btn" id="nextMonth">›</button></div><div class="calendar" id="calendar"></div></section>
<div class="section"><h2>Daily Panchangam</h2><small>Hyderabad</small></div><section class="panel"><div class="controls"><button class="btn" id="prev">‹</button><input class="date" id="datePicker" type="date"><button class="btn" id="next">›</button></div><p class="status" id="status">Loading Panchangam…</p><div class="facts" id="facts"></div></section>
</main></div>
<script src="./panchangam.js"></script><script>
const $=id=>document.getElementById(id);let selected=new Date();let month=new Date(selected.getFullYear(),selected.getMonth(),1);const labels=[['Vara','vara'],['Thithi','thithi'],['Nakshatra','nakshatra'],['Yoga','yoga'],['Karana','karana'],['Masa','masa'],['Sunrise','sunrise'],['Sunset','sunset'],['Rahu Kalam','rahuKalam'],['Yamagandam','yamagandam'],['Abhijit Muhurtham','abhijit']];
function iso(d){return d.toISOString().slice(0,10)}function renderFacts(data){$('facts').innerHTML=labels.map(([label,key])=>`<div class="fact"><span>${label}</span><b>${data[key]||'—'}</b></div>`).join('')}
async function loadDay(){const value=$('datePicker').value;selected=new Date(value+'T12:00:00');$('status').textContent='Loading Panchangam…';try{const raw=await window.SiddhaPanchangam.fetchPanchangam(selected);renderFacts(window.SiddhaPanchangam.formatPanchangam(raw));$('status').textContent='Panchangam for '+selected.toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});}catch(e){renderFacts({});$('status').textContent='Panchangam data is temporarily unavailable. Please try again.'}renderCalendar()}
function renderCalendar(){const y=month.getFullYear(),m=month.getMonth();$('monthTitle').textContent=month.toLocaleDateString('en-IN',{month:'long',year:'numeric'});$('yearLabel').textContent=String(y);const first=new Date(y,m,1).getDay();const count=new Date(y,m+1,0).getDate();let html=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<first;i++)html+='<button class="day empty"></button>';for(let d=1;d<=count;d++){const current=new Date(y,m,d),same=iso(current)===iso(selected),today=iso(current)===iso(new Date());html+=`<button class="day ${same?'selected':''} ${today?'today':''}" data-day="${d}">${d}</button>`}$('calendar').innerHTML=html;$('calendar').querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{$('datePicker').value=iso(new Date(y,m,Number(b.dataset.day)));loadDay()})}
$('datePicker').value=iso(selected);$('prev').onclick=()=>{$('datePicker').value=iso(new Date(selected.getTime()-86400000));loadDay()};$('next').onclick=()=>{$('datePicker').value=iso(new Date(selected.getTime()+86400000));loadDay()};$('prevMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);renderCalendar()};$('nextMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);renderCalendar()};$('datePicker').onchange=loadDay;loadDay();
</script></body></html>
