<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchangam - Siddha Astro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 {
            text-align: center;
            color: #ffc107;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .panchangam-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ffc107;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .date-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        input[type="date"] {
            padding: 12px 15px;
            border: 2px solid #ffc107;
            border-radius: 8px;
            background: rgba(255, 193, 7, 0.1);
            color: #ffc107;
            font-size: 1em;
            cursor: pointer;
        }
        input[type="date"]:focus {
            outline: none;
            box-shadow: 0 0 10px #ffc107;
        }
        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #ffc107 0%, #ffb300 100%);
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 193, 7, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        .panchangam-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .panchangam-item {
            background: rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
            transition: transform 0.3s;
        }
        .panchangam-item:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.12);
        }
        .panchangam-item h3 {
            color: #ffc107;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            opacity: 0.8;
        }
        .panchangam-item p {
            font-size: 1.3em;
            font-weight: bold;
            color: #fff;
            line-height: 1.5;
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: #ffc107;
            font-size: 1.1em;
        }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 193, 7, 0.3);
            border-top: 4px solid #ffc107;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: rgba(244, 67, 54, 0.1);
            border: 2px solid #f44336;
            color: #ff9999;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 10px 20px;
            background: rgba(255, 193, 7, 0.2);
            border: 2px solid #ffc107;
            color: #ffc107;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .nav-btn:hover {
            background: #ffc107;
            color: #1a1a2e;
        }
        .api-info {
            background: rgba(100, 200, 255, 0.1);
            border: 1px solid #64c8ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #b3e5fc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>☀️ Panchangam</h1>

        <div class="panchangam-card">
            <div class="date-selector">
                <input type="date" id="dateInput" />
                <button onclick="loadPanchangam()">📅 Load Panchangam</button>
                <button onclick="loadToday()">📍 Today</button>
            </div>

            <div id="panchangamContent"></div>
        </div>

        <nav class="bottom"><a class="active" href="./index.html"><b>⌂</b>Home</a><a href="./horoscope.html"><b>☀</b>Horoscope</a><a href="./panchangam.html"><b>📅</b>Panchangam</a><a href="./scriptures.html"><b>📜</b>Scriptures</a><a href="#"><b>☷</b>More</a></nav></div>
    </div>

    <script src="panchangam-free-api.js"></script>
    <script>
        function setDefaultDate() {
            const today = new Date();
            const isoDate = today.toISOString().split('T')[0];
            document.getElementById('dateInput').value = isoDate;
        }

        async function loadPanchangam() {
            const dateInput = document.getElementById('dateInput').value;
            if (!dateInput) {
                alert('Please select a date');
                return;
            }

            const content = document.getElementById('panchangamContent');
            content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading Panchangam...</p></div>';

            try {
                const date = new Date(dateInput + 'T00:00:00');
                const panchangam = await window.SiddhaPanchangam.fetchPanchangam(date);

                if (panchangam) {
                    content.innerHTML = `
                        <div class="panchangam-grid">
                            <div class="panchangam-item">
                                <h3>Vara (Day)</h3>
                                <p>${panchangam.vara}</p>
                            </div>
                            <div class="panchangam-item">
                                <h3>Tithi (Lunar Day)</h3>
                                <p>${panchangam.thithi}</p>
                            </div>
                            <div class="panchangam-item">
                                <h3>Nakshatra (Star)</h3>
                                <p>${panchangam.nakshatra}</p>
                            </div>
                            <div class="panchangam-item">
                                <h3>Rashi (Moon Sign)</h3>
                                <p>${panchangam.rashi}</p>
                            </div>
                            <div class="panchangam-item">
                                <h3>Yoga</h3>
                                <p>${panchangam.yoga}</p>
                            </div>
                            <div class="panchangam-item">
                                <h3>Karana</h3>
                                <p>${panchangam.karana}</p>
                            </div>
                            <div class="panchangam-item">
                                <h3>Masa (Month)</h3>
                                <p>${panchangam.masa}</p>
                            </div>
                            <div class="panchangam-item">
                                <h3>Samvatsara (Year)</h3>
                                <p>${panchangam.samvathsara}</p>
                            </div>
                            <div class="panchangam-item">
                                <h3>Sunrise</h3>
                                <p>${panchangam.sunrise}</p>
                            </div>
                            <div class="panchangam-item">
                                <h3>Sunset</h3>
                                <p>${panchangam.sunset}</p>
                            </div>
                            <div class="panchangam-item">
                                <h3>Rahu Kalam</h3>
                                <p>${panchangam.rahuKalam}</p>
                            </div>
                            <div class="panchangam-item">
                                <h3>Yamagandam</h3>
                                <p>${panchangam.yamagandam}</p>
                            </div>
                        </div>
                    `;
                } else {
                    content.innerHTML = '<div class="error">Failed to load Panchangam data. Please try again.</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                content.innerHTML = `<div class="error">Error loading data: ${error.message}</div>`;
            }
        }

        function loadToday() {
            setDefaultDate();
            loadPanchangam();
        }

        window.addEventListener('load', () => {
            setDefaultDate();
            loadToday();
        });
    </script>
</body>
</html>
