<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panchangam — Siddha Astro</title><link rel="stylesheet" href="styles.css"></head><body><header class="app-header"><div class="header-inner"><a class="brand" href="index.html"><img src="logo.png" alt="Siddha Astro"><span><b class="brand-name">Siddha Astro</b><span class="brand-sub">Panchangam</span></span></a><div class="header-actions"><button class="icon-btn" id="theme-toggle">◐</button></div></div></header><main class="app-main"><section class="hero"><h1>Panchangam</h1><p>Daily Hindu calendar and auspicious timings.</p></section><section class="section-card"><div class="form-grid"><div class="field"><label for="pdate">Date</label><input id="pdate" type="date"></div><div class="field" style="display:flex;align-items:end"><button class="primary-btn" id="loadP">Load Panchangam</button></div></div><div class="result"><div class="panchang-grid" id="pgrid"></div></div></section></main><nav class="bottom-nav" aria-label="Primary navigation"><a class="nav-item" href="index.html">⌂<br>Home</a><a class="nav-item" href="panchangam.html">▣<br>Panchangam</a><a class="nav-item" href="kundali.html">◇<br>Kundali</a><a class="nav-item" href="horoscope.html">☼<br>Horoscope</a><a class="nav-item" href="more.html">•••<br>More</a></nav><script src="panchangam.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const d=document.getElementById('pdate');d.value=new Date().toISOString().slice(0,10);async function load(){const x=await SiddhaPanchangam.fetchPanchangam(new Date(d.value+'T12:00:00'));const labels={vara:'Vara',thithi:'Tithi',nakshatra:'Nakshatra',rashi:'Rashi',samvathsara:'Samvathsara',masa:'Masa',yoga:'Yoga',karana:'Karana',sunrise:'Sunrise',sunset:'Sunset',rahuKalam:'Rahu Kalam',yamagandam:'Yamagandam',abhijit:'Abhijit'};document.getElementById('pgrid').innerHTML=Object.entries(labels).map(([k,v])=>'<div class="metric"><small>'+v+'</small><strong>'+((x&&x[k])||'—')+'</strong></div>').join('')}document.getElementById('loadP').onclick=load;load()})</script><script src="app.js"></script></body></html>
