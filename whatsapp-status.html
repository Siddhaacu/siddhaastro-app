<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7f3">
<meta name="description" content="Create and share today's Siddha Astro Panchangam and devotional status.">
<title>Daily WhatsApp Status — Siddha Astro</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/styles.css">
<style>
.status-main{max-width:620px;margin:24px auto;padding:0 16px 110px}
.status-intro{text-align:center;margin:22px 0}
.status-intro h1{font-size:1.45rem;margin:0 0 8px;color:var(--text)}
.status-intro p{color:var(--muted);margin:0;line-height:1.5}
.status-preview{width:100%;max-width:420px;margin:18px auto;border-radius:18px;overflow:hidden;background:#eee;box-shadow:0 8px 28px #18251d24}
.status-preview img{display:block;width:100%;height:auto;min-height:360px;object-fit:contain}
.status-actions{display:grid;gap:12px;max-width:420px;margin:18px auto}
.status-actions button{width:100%;min-height:50px;border:0;border-radius:14px;font:700 1rem inherit;cursor:pointer}
.status-share{background:#176b48;color:white}
.status-download{background:var(--surface);color:var(--text);border:1px solid var(--border)!important}
.status-note{text-align:center;color:var(--muted);font-size:.88rem;line-height:1.5}
.status-error{color:#a33;text-align:center}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="header-inner"><a class="brand" href="/index.html"><img src="/logo.png" alt="Siddha Astro"><span class="brand-name">Siddha Astro</span></a><a class="link" href="/index.html">Home</a></div></header>
<main class="status-main">
<section class="status-intro"><h1>Today's WhatsApp Status</h1><p>Daily Panchangam and devotional sloka in one Siddha Astro image</p></section>
<div id="statusLoading" class="message info">Preparing today's Panchangam and sloka…</div>
<div class="status-preview"><img id="statusPreview" alt="Today's Siddha Astro WhatsApp Status preview"></div>
<div class="status-actions">
<button id="statusShare" class="status-share" type="button" disabled>Share image</button>
<button id="statusDownload" class="status-download" type="button" disabled>Download image</button>
</div>
<p class="status-note">Tap Share image, choose WhatsApp, then select My Status and post. WhatsApp requires your final confirmation.</p>
<p id="statusError" class="status-error" role="alert"></p>
</main>
<nav class="nav" aria-label="Primary navigation"><a href="/index.html"><span>Home</span></a><a href="/panchangam.html"><span>Panchangam</span></a><a href="/horoscope.html"><span>Horoscope</span></a><a href="/kundali.html"><span>Kundali</span></a><a href="/more.html"><span>More</span></a></nav>
</div>
<script src="/app.js"></script>
<script src="/panchangam.js"></script>
<script src="/daily-slokas.js"></script>
<script src="/whatsapp-status.js"></script>
</body>
</html>
