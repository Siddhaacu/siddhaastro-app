<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Horoscope — Siddha Astro</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header class="header"><div class="header-inner"><a class="brand" href="index.html"><img src="logo.png" alt="Siddha Astro"><span><span class="brand-name">Siddha Astro</span><span class="brand-tag">Vedic wisdom, simply presented</span></span></a><div class="page-title"><strong>Horoscope</strong><span>Rashi guidance</span></div></div></header><div class="controls"><button class="lang-btn" data-lang aria-label="Language">తెలుగు</button><button class="icon-btn" data-theme>◐</button><button class="font-btn" data-font="down">−</button><span class="font-size" data-font-size>100%</span><button class="font-btn" data-font="up">+</button></div><main class="main"><section class="hero"><div class="eyebrow">Daily guidance</div><h1>Horoscope</h1><p>Select your rashi.</p></section><section class="card"><div class="rashi-grid" id="rashiGrid"></div></section><section class="card" id="horoscopeDisplay"><div class="empty">Choose a rashi.</div></section></main><nav class="nav"><a href="index.html" class="">⌂<span>Home</span></a><a href="panchangam.html" class="">◫<span>Panchangam</span></a><a href="horoscope.html" class="active">✦<span>Horoscope</span></a><a href="kundali.html" class="">◈<span>Kundali</span></a><a href="more.html" class="">•••<span>More</span></a></nav></div><script src="app.js"></script><script src="horoscope.js"></script><script>const R=[["Mesha","♈"],["Vrishabha","♉"],["Mithuna","♊"],["Karkataka","♋"],["Simha","♌"],["Kanya","♍"],["Tula","♎"],["Vrischika","♏"],["Dhanu","♐"],["Makara","♑"],["Kumbha","♒"],["Meena","♓"]];function show(r){const h=SiddhaHoroscope.getTodayHoroscope(r);document.querySelectorAll(".rashi").forEach(b=>b.classList.toggle("active",b.dataset.r===r));horoscopeDisplay.innerHTML='<h2>'+r+'</h2><p>'+h.period+' • '+h.element+' • '+h.ruler+'</p><div class="result-grid"><div class="tile"><div class="tile-label">Today</div><div class="tile-value">'+h.predictions.daily+'</div></div><div class="tile"><div class="tile-label">Career</div><div class="tile-value">'+h.predictions.career+'</div></div><div class="tile"><div class="tile-label">Love</div><div class="tile-value">'+h.predictions.love+'</div></div><div class="tile"><div class="tile-label">Health</div><div class="tile-value">'+h.predictions.health+'</div></div></div>'}document.addEventListener("DOMContentLoaded",()=>{rashiGrid.innerHTML=R.map(x=>'<button class="rashi" data-r="'+x[0]+'"><span class="rashi-symbol">'+x[1]+'</span><span class="rashi-name">'+x[0]+'</span></button>').join("");document.querySelectorAll(".rashi").forEach(b=>b.onclick=()=>show(b.dataset.r));show("Mesha")})</script></body></html>
