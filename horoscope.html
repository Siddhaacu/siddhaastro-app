<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Horoscope — Siddha Astro</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header class="header"><div class="header-inner"><a class="brand" href="index.html"><img src="logo.png" alt="Siddha Astro"><span><span class="brand-name">Siddha Astro</span><span class="brand-tag">Vedic wisdom, simply presented</span></span></a><div class="page-title"><strong>Horoscope</strong><span>Rashi guidance</span></div></div></header><div class="controls"><button class="lang-btn" data-lang aria-label="Language">తెలుగు</button><button class="icon-btn" data-theme>◐</button><button class="font-btn" data-font="down">−</button><span class="font-size" data-font-size>100%</span><button class="font-btn" data-font="up">+</button></div><main class="main"><section class="hero"><div class="eyebrow">Daily guidance</div><h1>Horoscope</h1><p>Select your rashi.</p></section><section class="card"><div class="rashi-grid" id="rashiGrid"></div></section><section class="card" id="horoscopeDisplay"><div class="empty">Choose a rashi.</div></section></main><nav class="nav"><a href="index.html" class="">⌂<span>Home</span></a><a href="panchangam.html" class="">◫<span>Panchangam</span></a><a href="horoscope.html" class="active">✦<span>Horoscope</span></a><a href="kundali.html" class="">◈<span>Kundali</span></a><a href="more.html" class="">•••<span>More</span></a></nav></div><script src="app.js"></script><script src="horoscope.js"></script><script>
const R=[["Mesha","♈"],["Vrishabha","♉"],["Mithuna","♊"],["Karkataka","♋"],["Simha","♌"],["Kanya","♍"],["Tula","♎"],["Vrischika","♏"],["Dhanu","♐"],["Makara","♑"],["Kumbha","♒"],["Meena","♓"]];
let dailyData=null;
async function loadDaily(){
  try{
    const r=await fetch("/.netlify/functions/horoscope-data",{cache:"no-store"});
    if(!r.ok) throw new Error("Daily horoscope unavailable");
    dailyData=await r.json();
    rashiGrid.innerHTML=R.map(x=>'<button class="rashi" data-r="'+x[0]+'"><span class="rashi-symbol">'+x[1]+'</span><span class="rashi-name">'+x[0]+'</span></button>').join("");
    document.querySelectorAll(".rashi").forEach(b=>b.onclick=()=>show(b.dataset.r));
    show("Mesha");
  }catch(e){
    horoscopeDisplay.innerHTML='<div class="empty">Today\'s horoscope is being prepared. Please try again shortly.</div>';
  }
}
function show(r){
  const h=dailyData?.horoscopes?.[r];
  if(!h)return;
  document.querySelectorAll(".rashi").forEach(b=>b.classList.toggle("active",b.dataset.r===r));
  horoscopeDisplay.innerHTML='<div class="eyebrow">Daily Horoscope • '+dailyData.date+'</div><h2>'+h.icon+' '+r+'</h2><p>'+h.period+' • '+h.element+' • '+h.ruler+'</p><div class="result-grid"><div class="tile"><div class="tile-label">Today</div><div class="tile-value">'+h.daily+'</div></div><div class="tile"><div class="tile-label">Career</div><div class="tile-value">'+h.career+'</div></div><div class="tile"><div class="tile-label">Love</div><div class="tile-value">'+h.love+'</div></div><div class="tile"><div class="tile-label">Health</div><div class="tile-value">'+h.health+'</div></div></div><p class="muted">Today’s Panchang influence: '+dailyData.panchang.tithi+' • '+dailyData.panchang.nakshatra+' • Moon Rashi: '+dailyData.panchang.rashi+'</p>';
}
document.addEventListener("DOMContentLoaded",loadDaily);
</script></body></html>
