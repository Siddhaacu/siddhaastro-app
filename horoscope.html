<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horoscope - Siddha Astro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 {
            text-align: center;
            color: #ffc107;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .horoscope-selector {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ffc107;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        select {
            padding: 12px 15px;
            border: 2px solid #ffc107;
            border-radius: 8px;
            background: rgba(255, 193, 7, 0.1);
            color: #ffc107;
            font-size: 1.1em;
            width: 100%;
            max-width: 400px;
            cursor: pointer;
        }
        select:focus {
            outline: none;
            box-shadow: 0 0 10px #ffc107;
        }
        .rashi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .rashi-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 193, 7, 0.3);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .rashi-card:hover {
            border-color: #ffc107;
            background: rgba(255, 193, 7, 0.1);
            transform: translateY(-5px);
        }
        .rashi-card.active {
            border-color: #ffc107;
            background: rgba(255, 193, 7, 0.2);
            box-shadow: 0 0 15px #ffc107;
        }
        .rashi-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .rashi-name {
            font-weight: bold;
            color: #ffc107;
            font-size: 0.95em;
        }
        .horoscope-content {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ffc107;
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
            margin-top: 20px;
        }
        .cosmic-message {
            background: rgba(255, 193, 7, 0.1);
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 8px;
            font-style: italic;
            color: #ffeb3b;
        }
        .rashi-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ffc107;
        }
        .rashi-header h2 {
            color: #ffc107;
            font-size: 2em;
        }
        .rashi-header .icon {
            font-size: 3em;
        }
        .rashi-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .detail-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 193, 7, 0.2);
        }
        .detail-label {
            color: #ffc107;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .detail-value {
            color: #fff;
            font-weight: bold;
        }
        .prediction-section {
            margin-bottom: 25px;
        }
        .section-title {
            color: #ffc107;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .section-content {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-left: 4px solid #ffc107;
            border-radius: 8px;
            line-height: 1.6;
        }
        .lucky-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .lucky-item {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid #ffc107;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9em;
        }
        .lucky-label {
            color: #ffc107;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            font-size: 0.8em;
        }
        .lucky-value {
            color: #fff;
        }
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 10px 20px;
            background: rgba(255, 193, 7, 0.2);
            border: 2px solid #ffc107;
            color: #ffc107;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .nav-btn:hover {
            background: #ffc107;
            color: #1a1a2e;
        }
        .api-info {
            background: rgba(100, 200, 255, 0.1);
            border: 1px solid #64c8ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #b3e5fc;
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: #ffc107;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>☀️ Daily Horoscope</h1>

        <div class="api-info">
            ✓ Using <strong>Free Horoscope Database</strong> - No API Key Required | Completely Free
        </div>

        <div class="horoscope-selector">
            <label style="color: #ffc107; font-weight: bold;">Select Your Rashi:</label>
            <select id="rashiSelect" onchange="loadHoroscope()">
                <option value="">-- Choose Your Zodiac Sign --</option>
                <option value="Mesha">♈ Mesha (Aries)</option>
                <option value="Vrishabha">♉ Vrishabha (Taurus)</option>
                <option value="Mithuna">♊ Mithuna (Gemini)</option>
                <option value="Karkataka">♋ Karkataka (Cancer)</option>
                <option value="Simha">♌ Simha (Leo)</option>
                <option value="Kanya">♍ Kanya (Virgo)</option>
                <option value="Tula">♎ Tula (Libra)</option>
                <option value="Vrischika">♏ Vrischika (Scorpio)</option>
                <option value="Dhanu">♐ Dhanu (Sagittarius)</option>
                <option value="Makara">♑ Makara (Capricorn)</option>
                <option value="Kumbha">♒ Kumbha (Aquarius)</option>
                <option value="Meena">♓ Meena (Pisces)</option>
            </select>

            <div class="rashi-grid" id="rashiGrid"></div>
        </div>

        <div class="horoscope-content" id="horoscopeContent">
            <p style="text-align: center; color: #aaa;">Select a rashi to view detailed horoscope</p>
        </div>

        <nav class="bottom"><a class="active" href="./index.html"><b>⌂</b>Home</a><a href="./horoscope.html"><b>☀</b>Horoscope</a><a href="./panchangam.html"><b>📅</b>Panchangam</a><a href="./scriptures.html"><b>📜</b>Scriptures</a><a href="#"><b>☷</b>More</a></nav></div>
    </div>

    <script src="panchangam-free-api.js"></script>
    <script src="horoscope-free-api.js"></script>
    <script>
        const rashis = ['Mesha', 'Vrishabha', 'Mithuna', 'Karkataka', 'Simha', 'Kanya', 'Tula', 'Vrischika', 'Dhanu', 'Makara', 'Kumbha', 'Meena'];
        const icons = ['♈', '♉', '♊', '♋', '♌', '♍', '♎', '♏', '♐', '♑', '♒', '♓'];

        function initializeRashiGrid() {
            const grid = document.getElementById('rashiGrid');
            grid.innerHTML = '';
            rashis.forEach((rashi, index) => {
                const card = document.createElement('div');
                card.className = 'rashi-card';
                card.onclick = () => {
                    document.getElementById('rashiSelect').value = rashi;
                    loadHoroscope();
                };
                card.innerHTML = `
                    <div class="rashi-icon">${icons[index]}</div>
                    <div class="rashi-name">${rashi}</div>
                `;
                grid.appendChild(card);
            });
        }

        async function loadHoroscope() {
            const rashi = document.getElementById('rashiSelect').value;
            if (!rashi) return;

            // Update active card
            document.querySelectorAll('.rashi-card').forEach((card, index) => {
                card.classList.toggle('active', rashis[index] === rashi);
            });

            const content = document.getElementById('horoscopeContent');
            content.innerHTML = '<div class="loading"><p>Loading horoscope...</p></div>';

            try {
                const horoscope = window.SiddhaHoroscope.getTodayHoroscope(rashi);

                if (horoscope) {
                    content.innerHTML = `
                        <div class="cosmic-message">
                            ✨ ${horoscope.cosmicMessage}
                        </div>

                        <div class="rashi-header">
                            <div class="icon">${horoscope.icon}</div>
                            <h2>${horoscope.rashi}</h2>
                        </div>

                        <div class="rashi-details">
                            <div class="detail-item">
                                <div class="detail-label">Element</div>
                                <div class="detail-value">${horoscope.element}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Ruler</div>
                                <div class="detail-value">${horoscope.ruler}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Period</div>
                                <div class="detail-value">${horoscope.period}</div>
                            </div>
                        </div>

                        <div class="prediction-section">
                            <div class="section-title">📆 Daily Reading</div>
                            <div class="section-content">${horoscope.daily}</div>
                        </div>

                        <div class="prediction-section">
                            <div class="section-title">💼 Career</div>
                            <div class="section-content">${horoscope.career}</div>
                        </div>

                        <div class="prediction-section">
                            <div class="section-title">💕 Love & Relationships</div>
                            <div class="section-content">${horoscope.love}</div>
                        </div>

                        <div class="prediction-section">
                            <div class="section-title">🏥 Health</div>
                            <div class="section-content">${horoscope.health}</div>
                        </div>

                        <div class="prediction-section">
                            <div class="section-title">✨ Lucky Elements</div>
                            <div class="lucky-items">
                                <div class="lucky-item">
                                    <span class="lucky-label">Color</span>
                                    <span class="lucky-value">${horoscope.lucky.color}</span>
                                </div>
                                <div class="lucky-item">
                                    <span class="lucky-label">Number</span>
                                    <span class="lucky-value">${horoscope.lucky.number}</span>
                                </div>
                                <div class="lucky-item">
                                    <span class="lucky-label">Direction</span>
                                    <span class="lucky-value">${horoscope.lucky.direction}</span>
                                </div>
                                <div class="lucky-item">
                                    <span class="lucky-label">Gemstone</span>
                                    <span class="lucky-value">${horoscope.lucky.gemstone}</span>
                                </div>
                                <div class="lucky-item">
                                    <span class="lucky-label">Day</span>
                                    <span class="lucky-value">${horoscope.lucky.day}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                content.innerHTML = `<div style="color: #ff9999;">Error loading horoscope: ${error.message}</div>`;
            }
        }

        window.addEventListener('load', () => {
            initializeRashiGrid();
        });
    </script>
</body>
</html>
