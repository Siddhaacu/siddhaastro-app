<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchangam - Siddha Astro</title>
    <link rel="stylesheet" href="app-theme.css">
    <style>
        .date-input-group {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        @media (max-width: 600px) {
            .date-input-group {
                grid-template-columns: 1fr;
            }
        }

        .panchangam-grid-app {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
        }

        .panchang-item-app {
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: var(--spacing-md);
            text-align: center;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .panchang-item-app:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 12px var(--shadow);
            transform: translateY(-3px);
        }

        .panchang-label-app {
            font-size: calc(0.8em * var(--scale));
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: var(--spacing-sm);
            display: block;
        }

        .panchang-value-app {
            font-size: calc(1.05em * var(--scale));
            font-weight: 600;
            color: var(--accent);
            word-break: break-word;
        }

        .time-info {
            background: var(--bg-secondary);
            border-left: 4px solid var(--spiritual-saffron);
            padding: var(--spacing-lg);
            border-radius: 8px;
            margin-top: var(--spacing-lg);
        }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing-md);
            margin-top: var(--spacing-md);
        }

        .time-item {
            background: var(--bg-tertiary);
            padding: var(--spacing-md);
            border-radius: 8px;
        }

        .time-label {
            font-size: calc(0.8em * var(--scale));
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
        }

        .time-value {
            font-size: calc(1em * var(--scale));
            font-weight: 600;
            color: var(--spiritual-saffron);
        }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            padding: var(--spacing-md);
            border-radius: 8px;
            margin-bottom: var(--spacing-lg);
            font-size: calc(0.95em * var(--scale));
        }

        .message.success {
            background: rgba(76, 175, 80, 0.1);
            border-left: 4px solid #4caf50;
            color: #81c784;
        }

        .message.error {
            background: rgba(244, 67, 54, 0.1);
            border-left: 4px solid #f44336;
            color: #ef9a9a;
        }

        .message.info {
            background: rgba(33, 150, 243, 0.1);
            border-left: 4px solid #2196f3;
            color: #64b5f6;
        }
    </style>
</head>
<body class="dark-mode">
    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <h1>📅 Panchangam</h1>
            <p class="app-header-subtitle">Daily Hindu Calendar</p>
        </div>

        <!-- Controls Bar -->
        <div class="app-content" style="padding-top: 0;">
            <div class="controls-bar">
                <div class="theme-toggle">
                    <span>Theme:</span>
                    <button class="theme-toggle-btn" id="theme-toggle-btn">☀️</button>
                </div>
                <div class="font-controls">
                    <button class="font-control-btn" id="font-decrease-btn">−</button>
                    <span class="font-size-display" id="font-size-display">100%</span>
                    <button class="font-control-btn" id="font-increase-btn">+</button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="app-content">
            <!-- Date Input -->
            <div class="spiritual-card">
                <div class="spiritual-card-title">
                    <span class="spiritual-card-icon">🗓️</span>
                    Select a Date
                </div>
                <div class="date-input-group">
                    <input type="date" id="dateInput" />
                    <button class="btn btn-primary" onclick="loadPanchangam()">
                        📊 Load
                    </button>
                    <button class="btn btn-secondary" onclick="loadToday()">
                        📍 Today
                    </button>
                </div>
            </div>

            <!-- Messages -->
            <div id="messageContainer"></div>

            <!-- Date Display -->
            <div id="dateDisplay" style="text-align: center; margin-bottom: var(--spacing-lg);"></div>

            <!-- Panchangam Results -->
            <div id="panchangamResults"></div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Primary navigation">
        <a href="index-app.html" class="nav-item" aria-label="Home">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8"/><path d="M5.5 9.8V21h13V9.8M9.5 21v-6.5h5V21"/></svg></span><span class="nav-label">Home</span>
        </a>
        <a href="panchangam-app.html" class="nav-item active" aria-current="page" aria-label="Panchangam">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M7.5 3v4M16.5 3v4M3.5 9.5h17M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01M16 17h.01"/></svg></span><span class="nav-label">Panchangam</span>
        </a>
        <a href="horoscope-app.html" class="nav-item" aria-label="Horoscope">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg></span><span class="nav-label">Horoscope</span>
        </a>
        <a href="kundali-app.html" class="nav-item" aria-label="Kundali">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M3.5 12h17M6 6l12 12M18 6 6 18"/></svg></span><span class="nav-label">Kundali</span>
        </a>
        <a href="more-app.html" class="nav-item" aria-label="More">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></span><span class="nav-label">More</span>
        </a>
    </nav>

    <script src="app-controls.js"></script>
    <script src="panchangam-free-api-FIXED.js"></script>
    <script>
        // Panchangam App Functions
        function setDefaultDate() {
            const today = new Date();
            const isoDate = today.toISOString().split('T')[0];
            document.getElementById('dateInput').value = isoDate;
            updateDateDisplay(today);
        }

        function updateDateDisplay(date) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const formatted = date.toLocaleDateString('en-US', options);
            document.getElementById('dateDisplay').innerHTML = `
                <div style="font-size: calc(1.1em * var(--scale)); color: var(--accent); font-weight: 600;">
                    ${formatted}
                </div>
            `;
        }

        function showMessage(message, type = 'info') {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="message ${type}">${message}</div>`;
        }

        async function loadPanchangam() {
            const dateInput = document.getElementById('dateInput').value;
            if (!dateInput) {
                showMessage('⚠️ Please select a date', 'error');
                return;
            }

            const resultsDiv = document.getElementById('panchangamResults');
            resultsDiv.innerHTML = `
                <div style="text-align: center; padding: var(--spacing-lg);">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: var(--spacing-md); color: var(--text-secondary);">
                        Loading Panchangam...
                    </p>
                </div>
            `;

            try {
                const [year, month, day] = dateInput.split('-');
                const date = new Date(year, parseInt(month) - 1, day);
                
                updateDateDisplay(date);
                
                const panchangam = await window.SiddhaPanchangam.fetchPanchangam(date);

                if (panchangam) {
                    showMessage('✅ Panchangam loaded successfully', 'success');
                    displayPanchangam(panchangam);
                } else {
                    showMessage('❌ Unable to load Panchangam data', 'error');
                    resultsDiv.innerHTML = '';
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage(`❌ Error: ${error.message}`, 'error');
                resultsDiv.innerHTML = '';
            }
        }

        function displayPanchangam(data) {
            const resultsDiv = document.getElementById('panchangamResults');
            
            resultsDiv.innerHTML = `
                <div class="spiritual-card">
                    <div class="spiritual-card-title">
                        <span class="spiritual-card-icon">✨</span>
                        Panchangam Elements
                    </div>
                    <div class="panchangam-grid-app">
                        <div class="panchang-item-app">
                            <span class="panchang-label-app">Vara</span>
                            <span class="panchang-value-app">${data.vara || '—'}</span>
                        </div>
                        <div class="panchang-item-app">
                            <span class="panchang-label-app">Tithi</span>
                            <span class="panchang-value-app">${data.thithi || '—'}</span>
                        </div>
                        <div class="panchang-item-app">
                            <span class="panchang-label-app">Nakshatra</span>
                            <span class="panchang-value-app">${data.nakshatra || '—'}</span>
                        </div>
                        <div class="panchang-item-app">
                            <span class="panchang-label-app">Rashi</span>
                            <span class="panchang-value-app">${data.rashi || '—'}</span>
                        </div>
                        <div class="panchang-item-app">
                            <span class="panchang-label-app">Yoga</span>
                            <span class="panchang-value-app">${data.yoga || '—'}</span>
                        </div>
                        <div class="panchang-item-app">
                            <span class="panchang-label-app">Karana</span>
                            <span class="panchang-value-app">${data.karana || '—'}</span>
                        </div>
                        <div class="panchang-item-app">
                            <span class="panchang-label-app">Masa</span>
                            <span class="panchang-value-app">${data.masa || '—'}</span>
                        </div>
                        <div class="panchang-item-app">
                            <span class="panchang-label-app">Samvatsara</span>
                            <span class="panchang-value-app">${data.samvathsara || '—'}</span>
                        </div>
                    </div>
                </div>

                <div class="time-info">
                    <div class="spiritual-card-title" style="margin-bottom: var(--spacing-lg);">
                        <span class="spiritual-card-icon">⏰</span>
                        Important Times
                    </div>
                    <div class="time-grid">
                        <div class="time-item">
                            <div class="time-label">Sunrise</div>
                            <div class="time-value">${data.sunrise || '—'}</div>
                        </div>
                        <div class="time-item">
                            <div class="time-label">Sunset</div>
                            <div class="time-value">${data.sunset || '—'}</div>
                        </div>
                        <div class="time-item">
                            <div class="time-label">Rahu Kalam</div>
                            <div class="time-value" style="font-size: calc(0.9em * var(--scale));">${data.rahuKalam || '—'}</div>
                        </div>
                        <div class="time-item">
                            <div class="time-label">Yamagandam</div>
                            <div class="time-value" style="font-size: calc(0.9em * var(--scale));">${data.yamagandam || '—'}</div>
                        </div>
                        <div class="time-item">
                            <div class="time-label">Abhijit</div>
                            <div class="time-value" style="font-size: calc(0.9em * var(--scale));">${data.abhijit || '—'}</div>
                        </div>
                    </div>
                </div>

                <div style="margin-top: var(--spacing-lg); padding: var(--spacing-lg); background: var(--bg-secondary); border-radius: 12px;">
                    <p style="color: var(--text-secondary); font-size: calc(0.85em * var(--scale)); text-align: center;">
                        💡 <strong>Rahu Kalam:</strong> Avoid starting important activities<br>
                        <strong>Yamagandam:</strong> Another inauspicious time<br>
                        <strong>Abhijit:</strong> Most auspicious time of the day
                    </p>
                </div>
            `;
        }

        function loadToday() {
            setDefaultDate();
            setTimeout(loadPanchangam, 100);
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            console.log('🔮 Panchangam App loaded');
            setDefaultDate();
            // Auto-load today's panchangam
            setTimeout(loadPanchangam, 500);
        });
    </script>
</body>
</html>
